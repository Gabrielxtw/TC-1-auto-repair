services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tc1-repairshop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Passw0rd!Dev}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD:-Passw0rd!Dev}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tc1-repairshop-network

  migrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrations
    container_name: tc1-repairshop-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TC1RepairShop;User Id=sa;Password=${SA_PASSWORD:-Passw0rd!Dev};TrustServerCertificate=True;"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:-Admin@123}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - tc1-repairshop-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tc1-repairshop-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TC1RepairShop;User Id=sa;Password=${SA_PASSWORD:-Passw0rd!Dev};TrustServerCertificate=True;"
      Jwt__Secret: "${JWT_SECRET:-change-this-secret-in-production-min-32-chars}"
      Jwt__Issuer: "TC1.RepairShop"
      Jwt__Audience: "TC1.RepairShop.Clients"
      Jwt__ExpirationMinutes: "60"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD:-Admin@123}"
      SendGrid__ApiKey: "${SENDGRID_API_KEY:-}"
      SendGrid__FromEmail: "${SENDGRID_FROM_EMAIL:-no-reply@example.com}"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - tc1-repairshop-network

networks:
  tc1-repairshop-network:
    driver: bridge

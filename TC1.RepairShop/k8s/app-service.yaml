apiVersion: v1
kind: Service
metadata:
  name: dotnet-service
spec:
  # On EKS this creates a public AWS load balancer (the API answers on port 8080).
  # Delete this Service before terraform destroy, or the VPC cannot be removed.
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30100

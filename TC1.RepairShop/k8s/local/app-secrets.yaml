# Local development only. On EKS the pipeline creates this Secret with the real values
# (Terraform output and GitHub secrets), so it must stay out of the k8s/ folder it applies.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=mssql-service,1433;Database=TC1;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
  Jwt__Secret: "__CHANGE_ME_USE_ENV_VAR_OR_USER_SECRETS__"
  SeedAdmin__Password: "123"
  # Must not be empty: the API stops at startup without a SendGrid key. With this placeholder
  # it runs normally and only e-mail delivery fails (logged as an error).
  SendGrid__ApiKey: "SG.not-configured"

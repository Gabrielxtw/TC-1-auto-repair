name: .NET 10 Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore TC1.RepairShop/TC1.RepairShop.slnx

      - name: BUILD
        run: dotnet build TC1.RepairShop/TC1.RepairShop.slnx --no-restore --configuration Release

      - name: Salvar Cache dos Binários Compilados
        uses: actions/cache@v4
        with:
          path: |
            **/bin/Release
            **/obj/Release
          key: build-binaries-${{ github.sha }}

  test-and-coverage:
    name: Validação dos testes e cobertura
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore TC1.RepairShop/TC1.RepairShop.slnx

      - name: Recuperar Build
        uses: actions/cache@v4
        with:
          path: |
            **/bin/Release
            **/obj/Release
          key: build-binaries-${{ github.sha }}

      - name: Executar testes
        run: dotnet test TC1.RepairShop/TC1.RepairShop.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Instalar ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Validar cobertura mínima
        run: |
          reportgenerator \
            "-reports:**/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Html;TextSummary" \
            "-minimumCoverageThresholds:lineCoverage=80"

  terraform:
    name: Terraform & Deploy
    needs: test-and-coverage
    # Deploys only from main (push or manual run); pull requests stop after the tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same group as infra.yml, so two Terraform runs never touch the state at the same time.
    concurrency:
      group: terraform
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Fails before creating anything if the app secrets are missing from the repository settings.
      - name: Check the app secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::Repository secret JWT_SECRET is missing or shorter than 32 characters (HMAC-SHA256 key)."
            exit 1
          fi
          if [ -z "$SEED_ADMIN_PASSWORD" ]; then
            echo "::error::Repository secret SEED_ADMIN_PASSWORD is missing."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Configure AWS credentials (Learner Lab session)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # Learner Lab does not let Terraform manage S3 buckets, so the state bucket is created here,
      # once per AWS account (each lab is a different account).
      - name: Ensure the Terraform state bucket exists
        run: |
          BUCKET="tc1-repairshop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api wait bucket-exists --bucket "$BUCKET"
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled \
            || echo "::warning::Could not enable versioning on $BUCKET"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Terraform apply (cluster and database)
        working-directory: TC1.RepairShop/infra
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -out=tfplan
          terraform apply tfplan

      # The API runs its database migrations at startup, so the first deploy waits until the
      # SQL Server host finishes its first boot (installs Docker and pulls the image).
      - name: Wait for the database
        working-directory: TC1.RepairShop/infra
        run: |
          aws eks update-kubeconfig --region us-east-1 --name "$(terraform output -raw cluster_name)"
          DB_HOST="$(terraform output -raw db_host)"
          kubectl delete job db-wait --ignore-not-found
          kubectl create job db-wait --image=bash:5.2 -- \
            bash -c "until (echo > /dev/tcp/$DB_HOST/1433) 2>/dev/null; do sleep 10; done"
          kubectl wait --for=condition=complete job/db-wait --timeout=15m
          kubectl delete job db-wait

      - name: Create the app Secret
        working-directory: TC1.RepairShop/infra
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          # The API stops at startup with an empty SendGrid key; a placeholder keeps it running.
          if [ -z "$SENDGRID_API_KEY" ]; then
            echo "::warning::Repository secret SENDGRID_API_KEY is not set: the API runs, but e-mails are not sent."
            SENDGRID_API_KEY="SG.not-configured"
          fi
          CONN="$(terraform output -raw db_connection_string)"
          echo "::add-mask::$CONN"
          kubectl create secret generic app-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="$CONN" \
            --from-literal=Jwt__Secret="$JWT_SECRET" \
            --from-literal=SeedAdmin__Password="$SEED_ADMIN_PASSWORD" \
            --from-literal=SendGrid__ApiKey="$SENDGRID_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          kubectl apply -f TC1.RepairShop/k8s/
          # Pods read Secrets only when they start, so restart them to pick up new values.
          kubectl rollout restart deployment/dotnet-deployment
          kubectl rollout status deployment/dotnet-deployment --timeout=5m
          kubectl get service dotnet-service